name: Build NIVA for Windows

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "index.html"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "assets/brand/**"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check src/main/index.cjs
          node --check src/preload/index.cjs
          node --check src/shared/profile-model.cjs
          node --check scripts/dev.mjs

      - name: Run unit tests
        run: npm test

      - name: Type-check and build renderer
        run: npm run build

      - name: Build NSIS installer and portable EXE
        run: npm run dist:win

      - name: Validate EXE architecture and generate SHA-256 checksums
        shell: pwsh
        run: ./scripts/verify-windows-artifacts.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NIVA-Windows-x64-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
