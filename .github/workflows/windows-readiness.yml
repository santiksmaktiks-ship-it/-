name: Windows toolchain readiness

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "yarn.lock"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "electron-builder.yml"
      - "src/**"
      - "scripts/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-windows-runner:
    name: Inspect Windows x64 runner
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Verify runner architecture and toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "OS: $([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)"
          Write-Host "Architecture: $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          Write-Host "Node: $(node --version)"
          Write-Host "npm: $(npm --version)"
          Write-Host "Git: $(git --version)"

          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne "X64") {
            throw "Expected an x64 Windows runner."
          }

          $nodeMajor = [int]((node --version).TrimStart("v").Split(".")[0])
          if ($nodeMajor -lt 22) {
            throw "Node.js 22 or later is required for the planned toolchain."
          }

          node -e "if (process.platform !== 'win32' || process.arch !== 'x64') process.exit(1); console.log('Node runtime: win32 x64')"

          $summary = @"
          ## Windows x64 toolchain readiness

          | Check | Result |
          |---|---|
          | OS | $([System.Runtime.InteropServices.RuntimeInformation]::OSDescription) |
          | OS architecture | $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture) |
          | Node.js | $(node --version) |
          | npm | $(npm --version) |
          | Git | $(git --version) |

          **Scope:** this job verifies a hosted Windows CI toolchain. It does not replace installation and launch testing on clean Windows 10/11 desktop systems.
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
