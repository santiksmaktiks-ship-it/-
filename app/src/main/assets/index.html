<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b0d14">
<title>NOVA</title>
<style>
:root{--bg:#0b0d14;--p:#121623;--p2:#171c2c;--line:#252a3c;--t:#f6f7fb;--m:#969db5;--a:#7c5cff;--mine:#6b4de8;--ok:#34d399}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,textarea{font:inherit}
.app{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 10% 0,rgba(124,92,255,.16),transparent 32%),radial-gradient(circle at 100% 100%,rgba(53,204,255,.08),transparent 28%)}
.top{height:66px;display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(11,13,20,.86);backdrop-filter:blur(18px)}
.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#7c5cff,#b08cff);display:grid;place-items:center;font-weight:900}.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.6px}.grow{flex:1}
.icon{width:40px;height:40px;border:0;background:transparent;color:var(--t);border-radius:12px}.icon:active{background:var(--p2)}
.main{flex:1;min-height:0;display:flex}.side{width:320px;border-right:1px solid var(--line);background:rgba(14,17,27,.9);display:flex;flex-direction:column}.sidein{padding:14px}.me{display:flex;align-items:center;gap:10px;margin-bottom:12px}.ava{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,#26324a,#7c5cff)}.meta{min-width:0}.meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta span{color:var(--m);font-size:11px}.search{width:100%;height:42px;background:#0e121d;border:1px solid var(--line);border-radius:14px;color:var(--t);padding:0 12px;outline:0}.list{overflow:auto;padding:5px 8px}.item{display:flex;align-items:center;gap:11px;padding:11px;border-radius:15px;margin:2px 0}.item.active{background:linear-gradient(135deg,rgba(124,92,255,.17),rgba(124,92,255,.05))}.ct{flex:1;min-width:0}.ct b{display:block;font-size:14px}.ct span{display:block;color:var(--m);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat{flex:1;min-width:0;display:flex;flex-direction:column}.head{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;padding:10px 14px;background:rgba(14,17,27,.7);backdrop-filter:blur(18px)}.tools{margin-left:auto;display:flex}.status{color:var(--ok);font-size:11px}.msgs{flex:1;overflow:auto;padding:18px}.day{text-align:center;color:var(--m);font-size:11px;margin:0 0 15px}.row{display:flex;margin:8px 0;animation:up .2s ease}.row.mine{justify-content:flex-end}.bubble{max-width:min(78%,560px);padding:9px 12px;background:#1c2334;border:1px solid rgba(255,255,255,.05);border-radius:17px 17px 17px 5px}.mine .bubble{background:linear-gradient(135deg,#6145dc,#7c5cff);border-radius:17px 17px 5px 17px}.bubble p{margin:0;white-space:pre-wrap;line-height:1.35}.stamp{font-size:9px;opacity:.65;text-align:right;margin-top:4px}.sticker{font-size:44px;line-height:1}.compose{padding:10px 12px 14px;background:linear-gradient(180deg,transparent,rgba(8,10,16,.75) 18%)}.tray{display:none;grid-template-columns:repeat(8,1fr);gap:6px;background:var(--p);border:1px solid var(--line);padding:9px;border-radius:18px;margin-bottom:8px}.tray.open{display:grid}.sbtn{border:0;background:var(--p2);border-radius:12px;aspect-ratio:1;font-size:24px}.bar{display:flex;align-items:flex-end;gap:6px;background:rgba(18,22,35,.96);border:1px solid var(--line);border-radius:18px;padding:7px}.bar textarea{flex:1;max-height:90px;resize:none;border:0;outline:0;background:transparent;color:var(--t);padding:7px;line-height:1.35}.send{width:42px;height:42px;border:0;border-radius:14px;background:linear-gradient(135deg,#7c5cff,#a17cff);color:#fff;font-weight:900}.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--m)}.orb{width:105px;height:105px;border-radius:30px;margin:auto;background:radial-gradient(circle at 35% 30%,#c0a4ff,#7c5cff 38%,#1b1730 72%);box-shadow:0 0 70px rgba(124,92,255,.24);animation:float 3s ease-in-out infinite}.modal{position:fixed;inset:0;display:none;place-items:center;padding:18px;background:rgba(5,7,12,.72);backdrop-filter:blur(12px);z-index:5}.modal.open{display:grid}.card{width:min(440px,100%);background:var(--p);border:1px solid var(--line);border-radius:24px;padding:20px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:11px;color:var(--m)}.field input{height:44px;background:#0e121d;border:1px solid var(--line);border-radius:12px;color:var(--t);padding:0 11px;outline:0}.acts{display:flex;justify-content:flex-end;gap:8px}.btn{border:1px solid var(--line);background:var(--p2);color:var(--t);padding:9px 13px;border-radius:12px}.btn.primary{background:var(--a);border-color:transparent}.hint{font-size:12px;color:var(--m);line-height:1.5}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#0f1420;border:1px solid var(--line);border-radius:13px;padding:10px 13px;font-size:12px;transition:.22s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes up{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translateY(-7px) rotate(2deg)}}@media(max-width:820px){.side{width:100%;display:none}.side.mobile{display:flex}.chat.hidden{display:none}.back{display:grid!important}}
.back{display:none}
</style></head>
<body><div class="app">
<div class="top"><div class="brand"><div class="logo">N</div><span>NOVA</span></div><div class="grow"></div><button class="icon" onclick="settings()">⚙️</button></div>
<div class="main"><aside id="side" class="side"><div class="sidein"><div class="me"><div id="myava" class="ava">N</div><div class="meta"><b id="myname">Nova User</b><span>LAN + WebRTC • online</span></div></div><input id="q" class="search" placeholder="Поиск чата…" oninput="renderList()"></div><div id="list" class="list"></div></aside>
<section id="chat" class="chat"><div id="head" class="head"></div><div id="msgs" class="msgs"></div><div class="compose"><div id="tray" class="tray"></div><div class="bar"><button class="icon" onclick="toggleTray()">😊</button><textarea id="input" rows="1" placeholder="Напиши сообщение…" onkeydown="key(event)"></textarea><button class="send" onclick="sendText()">➤</button></div></div></section></div></div>
<div id="modal" class="modal"><div class="card"><h2 style="margin:0 0 6px">Профиль</h2><div class="hint">Имя используется в локальном чате и при звонках.</div><div class="field"><label>Имя</label><input id="nick" maxlength="32"></div><div class="hint">☎️ и 📹 открывают реальную Jitsi WebRTC-комнату. Для собеседника используется та же комната.</div><div class="acts"><button class="btn" onclick="closeSettings()">Отмена</button><button class="btn primary" onclick="saveSettings()">Сохранить</button></div></div></div><div id="toast" class="toast"></div>
<script>
const C=[{id:'alex',name:'Alex',av:'A',col:'#4f8cff',st:'в сети',p:'Давай вечером?'},{id:'mila',name:'Mila',av:'M',col:'#ff6fb5',st:'была недавно',p:'✨ новый стикер'},{id:'max',name:'Max',av:'X',col:'#25c59a',st:'в сети',p:'Видео в 21:00'},{id:'luna',name:'Luna',av:'L',col:'#ff9a62',st:'в сети',p:'Окей, договорились'}];
const ST=['😂','🤣','🔥','❤️','💜','😎','🤯','🤝','👀','🎉','😭','😈','✨','🚀','💯','🫶'];
let active='alex',nick=(window.Android&&Android.getNickname)?Android.getNickname():'Nova User';
function esc(s){return String(s||'').replace(/[&<>'"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'})[c]})}
function keyFor(id){return 'nova_'+id}
function msgs(id){try{return JSON.parse(localStorage.getItem(keyFor(id))||'[]')}catch(e){return[]}}
function save(id,a){localStorage.setItem(keyFor(id),JSON.stringify(a.slice(-250)))}
function seed(){C.forEach(function(c,i){if(!msgs(c.id).length){var t=Date.now()-i*120000;save(c.id,[{id:'s'+i,sender:'them',text:c.p,ts:t},{id:'m'+i,sender:'me',text:i===0?'Красиво 😎':i===1?'Беру 🔥':i===2?'Да, погнали.':'Тогда до связи!',ts:t+40000}])}})}
function tm(ts){return new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
function renderList(){var q=(document.getElementById('q').value||'').toLowerCase();document.getElementById('list').innerHTML=C.filter(function(c){return c.name.toLowerCase().includes(q)}).map(function(c){var a=msgs(c.id),m=a[a.length-1];return '<div class="item '+(c.id===active?'active':'')+'" onclick="select(\''+c.id+'\')"><div class="ava" style="background:'+c.col+'22;color:'+c.col+'">'+c.av+'</div><div class="ct"><b>'+esc(c.name)+'</b><span>'+esc(m?(m.sticker||m.text):c.p)+'</span></div><span style="color:var(--m);font-size:10px">'+(m?tm(m.ts):'')+'</span></div>'}).join('')}
function select(id){active=id;document.getElementById('side').classList.remove('mobile');document.getElementById('chat').classList.remove('hidden');renderChat();renderList()}
function renderChat(){var c=C.find(function(x){return x.id===active})||C[0];document.getElementById('head').innerHTML='<button class="icon back" onclick="showList()">‹</button><div class="ava" style="width:42px;height:42px;background:'+c.col+'22;color:'+c.col+'">'+c.av+'</div><div class="meta"><b>'+esc(c.name)+'</b><span class="status">'+esc(c.st)+'</span></div><div class="tools"><button class="icon" onclick="call(\'audio\')">☎️</button><button class="icon" onclick="call(\'video\')">📹</button></div>';var a=msgs(active),box=document.getElementById('msgs');if(!a.length){box.innerHTML='<div class="empty"><div><div class="orb"></div><h3 style="color:var(--t)">Начни разговор</h3><div>Сообщения ходят по локальной Wi‑Fi сети.</div></div></div>';return}box.innerHTML='<div class="day">сегодня</div>'+a.map(function(m){return '<div class="row '+(m.sender==='me'?'mine':'')+'"><div class="bubble">'+(m.sticker?'<div class="sticker">'+m.sticker+'</div>':'<p>'+esc(m.text)+'</p>')+'<div class="stamp">'+tm(m.ts)+'</div></div></div>'}).join('');box.scrollTop=box.scrollHeight}
function sendLocal(o){var m=Object.assign({id:String(Date.now())+Math.random(),sender:'me',ts:Date.now()},o),a=msgs(active);a.push(m);save(active,a);renderChat();renderList();if(window.Android&&Android.sendLanMessage)Android.sendLanMessage(JSON.stringify({type:'chat',chat:active,msg:m}))}
function sendText(){var x=document.getElementById('input'),t=x.value.trim();if(!t)return;sendLocal({text:t});x.value='';x.style.height='auto'}
function key(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}e.target.style.height='auto';e.target.style.height=Math.min(90,e.target.scrollHeight)+'px'}
function toggleTray(){document.getElementById('tray').classList.toggle('open')}
function sticker(s){sendLocal({sticker:s});toggleTray()}
function renderSt(){document.getElementById('tray').innerHTML=ST.map(function(s){return '<button class="sbtn" onclick="sticker(\''+s+'\')">'+s+'</button>'}).join('')}
function call(mode){if(window.Android&&Android.startCall)Android.startCall(mode,active)}
function onLanMessage(raw){try{var p=JSON.parse(raw);if(!p||p.type!=='chat'||!p.msg||!p.senderId)return;if(window.Android&&p.senderId===Android.getDeviceId())return;var id=p.chat||active,a=msgs(id);if(a.some(function(x){return x.id===p.msg.id}))return;p.msg.sender='them';a.push(p.msg);save(id,a);if(id===active)renderChat();else toast('Новое сообщение от '+(p.nick||'пользователя'));renderList()}catch(e){}}
function settings(){document.getElementById('nick').value=nick;document.getElementById('modal').classList.add('open')}
function closeSettings(){document.getElementById('modal').classList.remove('open')}
function saveSettings(){nick=document.getElementById('nick').value.trim()||'Nova User';if(window.Android&&Android.setNickname)Android.setNickname(nick);document.getElementById('myname').textContent=nick;document.getElementById('myava').textContent=nick[0].toUpperCase();closeSettings();toast('Профиль сохранён')}
function showList(){document.getElementById('side').classList.add('mobile');document.getElementById('chat').classList.add('hidden')}
function toast(t){var x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(function(){x.classList.remove('show')},2200)}
seed();renderSt();document.getElementById('myname').textContent=nick;document.getElementById('myava').textContent=nick[0].toUpperCase();renderList();renderChat();
</script></body></html>
